<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="badge">
            <i class="fa-solid fa-cake-candles"></i>
            <span>DAY 25 &bull; JAVASCRIPT</span>
        </div>
        <h1>Age <span>Calculator</span></h1>
        <p class="subtitle">Calculate your exact chronological age and life metrics in real time.</p>

        <form id="ageCalculator">
            <div class="form-group">
                <label for="birthdate"><i class="fa-regular fa-calendar-days"></i> Select or Enter your birthdate:</label>
                <input type="date" id="birthdate" required>
            </div>
            <div class="form-group">
                <button type="submit">
                    <i class="fa-solid fa-calculator"></i>
                    <span>Calculate Age</span>
                </button>
            </div>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="result" id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>   
</body>
</html>
