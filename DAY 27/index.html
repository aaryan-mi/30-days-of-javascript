<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Carousel | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="carousel-app">
        <div class="badge">
            <i class="fa-solid fa-images"></i>
            <span>DAY 27 &bull; JAVASCRIPT</span>
        </div>
        <h1>VK18 <span>Image Carousel</span></h1>
        <p class="subtitle">Interactive slider featuring King Kohli &bull; Virat Kohli (VK18) edition.</p>

        <div class="main-container">
            <div class="col-1">
                <div class="items">
                    <div class="item active">
                        <img src="./imgs/vk18-1.jpg" alt="Virat Kohli Match Action">
                    </div>
                    <div class="item">
                        <img src="./imgs/vk18-2.jpg" alt="Virat Kohli Celebration">
                    </div>
                    <div class="item">
                        <img src="./imgs/vk18-3.jpg" alt="Virat Kohli Portrait">
                    </div>
                    <div class="item">
                        <img src="./imgs/vk18-4.jpg" alt="Virat Kohli IPL Stage">
                    </div>
                </div>
            </div>

            <div class="col-2">
                <div class="carousel">
                    <button id="prevBtn" aria-label="Previous Slide"><i class="fas fa-angle-left"></i></button>
                    <button id="nextBtn" aria-label="Next Slide"><i class="fas fa-angle-right"></i></button>
                    <div class="slides-container">
                        <div class="slide"> 
                            <img src="./imgs/vk18-1.jpg" alt="Virat Kohli Match Action">
                        </div> 
                        <div class="slide"> 
                            <img src="./imgs/vk18-2.jpg" alt="Virat Kohli Celebration">
                        </div> 
                        <div class="slide"> 
                            <img src="./imgs/vk18-3.jpg" alt="Virat Kohli Portrait">
                        </div> 
                        <div class="slide"> 
                            <img src="./imgs/vk18-4.jpg" alt="Virat Kohli IPL Stage">
                        </div> 
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
