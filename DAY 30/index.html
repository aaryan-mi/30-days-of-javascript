<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Calculator | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="badge">
            <i class="fa-solid fa-money-bill-wave"></i>
            <span>DAY 30 &bull; JAVASCRIPT</span>
        </div>
        <h1>Cash <span>Calculator</span></h1>
        <p class="subtitle">Calculate active Indian currency denominations and total cash in words.</p>

        <div class="calculator-rows">
            <div class="row">
                <div class="note-badge">
                    <img src="images/five_hundred_note.png" alt="Rs. 500 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;500</span>
                    <input type="number" id="et500" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt500" class="cash-text">&#8377;0</span>
            </div>

            <div class="row">
                <div class="note-badge">
                    <img src="images/two_hundred_note.png" alt="Rs. 200 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;200</span>
                    <input type="number" id="et200" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt200" class="cash-text">&#8377;0</span>
            </div>

            <div class="row">
                <div class="note-badge">
                    <img src="images/one_hundred.png" alt="Rs. 100 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;100</span>
                    <input type="number" id="et100" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt100" class="cash-text">&#8377;0</span>
            </div>

            <div class="row">
                <div class="note-badge">
                    <img src="images/fifty_note.png" alt="Rs. 50 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;50</span>
                    <input type="number" id="et50" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt50" class="cash-text">&#8377;0</span>
            </div>

            <div class="row">
                <div class="note-badge">
                    <img src="images/twenty_note.png" alt="Rs. 20 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;20</span>
                    <input type="number" id="et20" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt20" class="cash-text">&#8377;0</span>
            </div>

            <div class="row">
                <div class="note-badge">
                    <img src="images/ten_note.png" alt="Rs. 10 Note">
                </div>
                <div class="input-wrapper">
                    <span class="denom-tag">&times; &#8377;10</span>
                    <input type="number" id="et10" class="cash-input" placeholder="0" min="0">
                </div>
                <span id="txt10" class="cash-text">&#8377;0</span>
            </div>
        </div>

        <div class="actions">
            <button id="btnReset">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
        </div>

        <div class="row result-part">
            <div class="total-label">Grand Total</div>
            <div id="txtFinalCash">&#8377;0</div>
            <div id="txtFinalCashInWords">Zero Rupees Only</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
