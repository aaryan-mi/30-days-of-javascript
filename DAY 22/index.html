<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="badge">
            <i class="fa-solid fa-dice"></i>
            <span>DAY 22 &bull; JAVASCRIPT</span>
        </div>
        <h1>Random <span>Number</span> Generator</h1>
        <p class="subtitle">Generate random numbers instantly between 1 and 100.</p>
        
        <div class="number-card">
            <div class="number-container">
                <span id="random-number">0</span>
            </div>
            <div class="range-tag">
                <i class="fa-solid fa-sliders"></i> Range: 1 &ndash; 100
            </div>
        </div>

        <button id="generate-btn">
            <i class="fa-solid fa-shuffle"></i>
            <span>Generate Number</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
