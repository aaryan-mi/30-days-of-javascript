<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Application | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="badge">
            <i class="fa-solid fa-arrow-up-1-9"></i>
            <span>DAY 24 &bull; JAVASCRIPT</span>
        </div>
        <h1>Interactive <span>Counter</span></h1>
        <p class="subtitle">Increment, decrement, and reset counters with real-time feedback.</p>

        <div class="counter-display">
            <span id="value">0</span>
        </div>

        <div class="btn-group">
            <button class="btn" id="decrease">
                <i class="fa-solid fa-minus"></i>
                <span>Decrease</span>
            </button>
            <button class="btn" id="reset">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
            <button class="btn" id="increase">
                <i class="fa-solid fa-plus"></i>
                <span>Increase</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
