<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="container-random-password">
            <div class="badge">
                <i class="fa-solid fa-shield-halved"></i>
                <span>DAY 21 &bull; JAVASCRIPT</span>
            </div>
            <h1>Generate a <br> <span>Random Password</span></h1>
            <p class="subtitle">Instantly create strong, secure, and random passwords.</p>
            <div class="display">
                <input type="text" id="password" placeholder="Generate password" readonly>
                <button type="button" id="copy" title="Copy to clipboard" aria-label="Copy password">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <button id="btn"><i class="fa-solid fa-bolt"></i> Generate Password</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
