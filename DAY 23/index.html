<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker | 30 Days JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="badge">
            <i class="fa-solid fa-calculator"></i>
            <span>DAY 23 &bull; JAVASCRIPT</span>
        </div>
        <h1>Prime <span>Number</span> Checker</h1>
        <p class="subtitle">Check if any positive integer is a prime or composite number.</p>
        
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="Enter a number (e.g. 17)" min="0">
        </div>

        <button id="checkButton">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Check Number</span>
        </button>

        <p id="resultMessage"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
